<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desk & Day · Widget embed demo</title>
    <style>
      body {
        margin: 0;
        font-family: Georgia, serif;
        background: #f7f3ec;
        color: #1a1714;
        min-height: 100vh;
        padding: 48px 24px;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
      }
      h1 {
        font-size: 2rem;
      }
      code {
        display: block;
        white-space: pre-wrap;
        background: #1a1714;
        color: #f4efe6;
        padding: 16px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Desk & Day widget demo</h1>
      <p>This page loads the floating chat widget. Use the script below on any site.</p>
      <code>&lt;script
  src="https://shopify-ai-sales-assistant.vercel.app/widget.js"
  data-position="right"
  data-color="#a67c52"
  defer
&gt;&lt;/script&gt;</code>
    </main>

    <script
      src="/widget.js"
      data-position="right"
      data-color="#a67c52"
      defer
    ></script>
  </body>
</html>
